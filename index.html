<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Galaxy</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Canvas Container -->
    <canvas class="webgl"></canvas>

    <!-- UI Overlay -->
    <div class="ui-container">
        <h1>Interactive Galaxy</h1>
        <p>Drag to rotate | Scroll to zoom</p>
        
        <!-- Theme Controls -->
        <div class="controls">
            <button class="btn active" onclick="changeTheme('fire')">Solar Fire</button>
            <button class="btn" onclick="changeTheme('neon')">Neon Cyberspace</button>
            <button class="btn" onclick="changeTheme('cosmic')">Deep Cosmic</button>
        </div>
    </div>

    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
